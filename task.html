<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>.SeperateModel · 派单页</title>
<style>
body{background:#0f1724;color:#d2dae6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;margin:0;padding:32px 20px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;color:#fff;margin:0 0 6px}
.sub{color:#627087;font-size:13px;margin-bottom:28px}
.card{background:#1a2235;border:1px solid #263144;border-radius:12px;padding:28px 24px;text-align:center}
.empty{color:#8a97a8;font-size:15px;margin-bottom:8px}
.tip{color:#4a5568;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>.SeperateModel · 派单页</h1>
  <div class="sub"><span class="dot"></span>当前无待处理任务 · 状态正常</div>
  <div class="card">
    <div class="empty">暂无进行中的派单</div>
    <div class="tip">所有历史任务已归档至 seperate_model.db</div>
  </div>
</div>
</body>
</html>
